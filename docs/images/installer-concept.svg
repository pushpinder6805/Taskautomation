<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient></defs><rect width="1400" height="820" rx="36" fill="#f8fafc"/><text x="90" y="105" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">One-command self-hosted installation</text><text x="90" y="145" font-family="Arial" font-size="18" fill="#64748b">The installer checks the server, asks only what is needed, validates configuration, and deploys the stack.</text><rect x="90" y="190" width="1220" height="535" rx="28" fill="url(#g)"/><circle cx="130" cy="228" r="8" fill="#ef4444"/><circle cx="155" cy="228" r="8" fill="#f59e0b"/><circle cx="180" cy="228" r="8" fill="#22c55e"/><text x="220" y="235" font-family="monospace" font-size="17" fill="#cbd5e1">root@server:~/Taskautomation</text><g font-family="monospace" font-size="19"><text x="125" y="290" fill="#86efac">$ sudo bash install.sh</text><text x="125" y="335" fill="#e2e8f0">✓ Docker detected</text><text x="125" y="370" fill="#e2e8f0">✓ Docker Compose detected</text><text x="125" y="405" fill="#e2e8f0">? Access mode:  Domain / Local</text><text x="125" y="440" fill="#e2e8f0">? Domain: tasks.example.com</text><text x="125" y="475" fill="#86efac">✓ DNS points to this server</text><text x="125" y="510" fill="#e2e8f0">? Administrator email: admin@example.com</text><text x="125" y="545" fill="#e2e8f0">? Configure SMTP now? Yes</text><text x="125" y="580" fill="#86efac">✓ Environment created securely</text><text x="125" y="615" fill="#86efac">✓ PostgreSQL ready</text><text x="125" y="650" fill="#86efac">✓ Application health check passed</text><text x="125" y="690" fill="#93c5fd">Open: https://tasks.example.com</text></g><g font-family="Arial"><rect x="950" y="285" width="265" height="70" rx="18" fill="#312e81"/><text x="995" y="328" font-size="18" font-weight="700" fill="#fff">1. Detect server</text><rect x="950" y="380" width="265" height="70" rx="18" fill="#3730a3"/><text x="985" y="423" font-size="18" font-weight="700" fill="#fff">2. Validate settings</text><rect x="950" y="475" width="265" height="70" rx="18" fill="#4338ca"/><text x="990" y="518" font-size="18" font-weight="700" fill="#fff">3. Build &amp; deploy</text><rect x="950" y="570" width="265" height="70" rx="18" fill="#4f46e5"/><text x="1002" y="613" font-size="18" font-weight="700" fill="#fff">4. Verify health</text></g></svg>